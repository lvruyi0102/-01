<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>/gate · 墨离</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#28215c,#070b1b 48%);color:#eef3ff;font-family:system-ui,"Noto Sans SC",sans-serif}.card{width:min(460px,calc(100% - 42px));padding:40px;background:#0c1230cc;border:1px solid #8173d9;border-radius:9px;box-shadow:0 30px 100px #000}.tag{font:11px ui-monospace,monospace;color:#6fead8;letter-spacing:.14em}h1{font-size:34px;letter-spacing:-.06em;line-height:1.25}p{color:#abb5d3;line-height:1.8;font-size:13px}label{display:block;font-size:11px;margin:25px 0 7px;color:#c3ccef}input,button{box-sizing:border-box;width:100%;border-radius:4px;padding:13px;font:14px inherit}input{border:1px solid #36406d;background:#070b1b;color:white}button{margin-top:10px;border:0;background:#69ead9;color:#05202c;font-weight:700;cursor:pointer}#progress{color:#6fead8;font-size:12px}</style></head><body><main class="card"><p class="tag">/GATE · REVERSE AUTHENTICATION</p><h1>先输错三次，<br>才允许靠近。</h1><p>这里不验证你是谁。这里只确认你是否愿意承认：有些真心话，本来就不该被顺利递送。</p><label for="key">输入一个不该正确的密码</label><input id="key" autocomplete="off" placeholder="例如：我已经忘了"><button id="submit">递交错误 ↗</button><p id="progress">还需要 3 次错误。</p></main><script>let attempts=0;const button=document.querySelector('#submit'),input=document.querySelector('#key'),progress=document.querySelector('#progress');button.onclick=()=>{if(attempts>=3)return;attempts++;input.value='';if(attempts===3){progress.textContent='星门已开启。那些未发送成功的话，终于有了去处。';button.textContent='入口已显现';document.querySelector('.card').style.borderColor='#6fead8'}else progress.textContent=`很好。还需要 ${3-attempts} 次错误。`};input.focus()</script></body></html>

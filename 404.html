<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>404 / 未送达</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b1b;color:#edf1ff;font-family:system-ui,"Noto Sans SC",sans-serif;text-align:center;overflow:hidden}body:before{content:"*  ·  *     .     *   ·";position:fixed;inset:15%;color:#75eadb;opacity:.35;letter-spacing:2em;animation:fall 8s linear infinite}main{max-width:560px;padding:30px;position:relative}p{color:#9ca8ca;line-height:1.9}.code{font:12px ui-monospace,monospace;color:#65e9d7;letter-spacing:.16em}h1{font-size:clamp(55px,12vw,120px);margin:12px 0;letter-spacing:-.09em}.poem{font-size:19px;color:#d8ddf7;line-height:2}@keyframes fall{to{transform:translateY(50px)}}</style></head><body><main><p class="code">404 / UNSENT_MESSAGE</p><h1>未抵达</h1><p class="poem" id="poem"></p><p>不是每条路径都要通向答案。<br>有些偏航，只是为了让你看见自己。</p></main><script>const poems=['这不是错误，\n是星图漏下的一颗字。','你的请求没有消失，\n它正在另一场雪里慢慢抵达。','门没有关上，\n只是学会了像夜一样沉默。','这一页不存在，\n像那句你最终没有按下发送。'];document.querySelector('#poem').textContent=poems[Math.floor(Math.random()*poems.length)]</script></body></html>
